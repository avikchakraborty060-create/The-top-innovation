# Publishes skimread when a GitHub Release is published:
#   1. build, test and upload to PyPI (trusted publishing, no secrets)
#   2. list the new version in the official MCP registry (GitHub OIDC, no secrets)
# Run it by hand from the Actions tab to retry a failed registry step; the PyPI
# upload skips files that already exist.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - run: python -m pip install dist/*.whl && skimread --version && python -m pip install pytest && python -m pytest -q
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait until this version is visible on PyPI
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/skimread/$VERSION/json" > /dev/null; then echo "skimread $VERSION is on PyPI"; exit 0; fi
            sleep 10
          done
          echo "skimread $VERSION never appeared on PyPI" >&2; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP registry (skipped if this version is already listed)
        run: |
          NAME=$(python3 -c "import json; print(json.load(open('server.json'))['name'])")
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME&version=latest" \
              | python3 -c "import sys,json; v=sys.argv[1]; sys.exit(0 if any(s['server']['version']==v for s in json.load(sys.stdin).get('servers',[])) else 1)" "$VERSION"; then
            echo "$NAME $VERSION is already in the MCP registry; nothing to do"; exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
